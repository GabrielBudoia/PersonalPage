services:
  db:
    image: postgres:16
    container_name: page-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: page
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - page-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d page"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  page-db-data: